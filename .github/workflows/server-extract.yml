name: server extract prod

on:
  schedule:
    # nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: server-extract-prod
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # must be a PAT: pushes made with GITHUB_TOKEN do not trigger the
          # downstream server build/publish and deploy workflows
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/prod.key
          chmod 600 ~/.ssh/prod.key
          cat >>~/.ssh/config <<END
          Host prod
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/prod.key
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          END
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
        env:
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}

      - name: Open DB tunnel
        run: |
          ssh -f -N -o ExitOnForwardFailure=yes -L 5433:127.0.0.1:5432 prod
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 5433; then
              echo "Tunnel is up"
              exit 0
            fi
            sleep 1
          done
          echo "Tunnel failed to come up"
          exit 1

      - name: Extract prod data
        working-directory: server
        env:
          PROD_DB_DSN: "postgres://${{ secrets.PROD_DB_USERNAME }}:${{ secrets.PROD_DB_PASSWORD }}@127.0.0.1:5433/${{ secrets.PROD_DB_DATABASE }}?sslmode=disable"
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: make extract.prod

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Nightly prod data extract $(date -u +%F)"
          git pull --rebase origin main
          git push origin main
