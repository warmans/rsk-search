<div class="w-100 vh-100 d-flex flex-column align-items-center">
  <div class="background-illustration speaker-image cover-background" [style.background-image]="'url(/assets/illustration/' + quoteImage + ')'"></div>
  @if (quote) {
    <div class="quote text-center d-flex flex-row align-items-center foreground">
      <div class="px-3 px-xl-5 px-lg-5">
        <!--button class="btn btn-primary btn-sm float-right" (click)="getQuote()">Generate</button-->
        <a class="text-paragraph quote-text text-block-bg px-3" [routerLink]="['/ep', quote?.epid]" [fragment]="'pos-' + quote?.pos">
          {{ quote?.quote }}
        </a>
        <div class="quote-footer pt-3">
          <div class="actor text-right">
            <span class="actor-name text-block-bg px-2">&mdash; {{ quote.actor }}</span>
          </div>
          <div class="refresh text-center pt-3">
            <button class="btn btn-primary btn-sm" (click)="getQuote()" title="Show another quote"><i class="bi-arrow-clockwise"></i> Refresh</button>
          </div>
        </div>
      </div>
    </div>
  }
</div>
